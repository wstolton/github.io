<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Log</title>
<style>
  :root {
    --bg: #12171B; --surface: #1B2228; --surface-alt: #232C33; --line: #2C363D;
    --chalk: #ECE7DA; --muted: #8B98A1; --hold: #D6491F; --gold: #C9A227; --green: #6B9E78;
    --danger: #C24A3F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171B; --surface: #1B2228; --surface-alt: #232C33; --line: #2C363D;
      --chalk: #ECE7DA; --muted: #8B98A1; --hold: #D6491F; --gold: #C9A227; --green: #6B9E78;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171B; --surface: #1B2228; --surface-alt: #232C33; --line: #2C363D;
    --chalk: #ECE7DA; --muted: #8B98A1; --hold: #D6491F; --gold: #C9A227; --green: #6B9E78;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--chalk);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 60px; }
  .disp {
    font-family: "Arial Narrow", Arial, sans-serif;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .eyebrow { font-size: 11px; color: var(--hold); margin-bottom: 4px; }
  h1.title { font-size: 28px; color: var(--chalk); margin: 0 0 6px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
  .tab-btn {
    flex-shrink: 0; font-size: 11px; padding: 9px 13px; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .tab-btn.active { background: var(--hold); border-color: var(--hold); color: #fff; }
  .blurb { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0 0 10px; }
  .routine-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .addbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn { font-family: inherit; border: none; border-radius: 6px; cursor: pointer; }
  .btn-sm { padding: 10px 14px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--hold); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-block { display: block; width: 100%; padding: 13px; text-align: center; }
  .cat-label { font-size: 11px; color: var(--gold); margin-bottom: 10px; letter-spacing: 0.1em; }
  .cat-group { margin-bottom: 22px; }
  .row { display: flex; align-items: flex-start; gap: 10px; }
  .step-badge {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-alt);
    border: 1px solid var(--line); color: var(--muted); font-size: 10px; display: flex;
    align-items: center; justify-content: center; margin-top: 14px;
  }
  .card {
    display: block; width: 100%; text-align: left; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-size: 15px; color: var(--chalk); }
  .card-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .pill { font-size: 10px; padding: 3px 8px; border-radius: 3px; letter-spacing: 0.08em; white-space: nowrap; }
  .pill-muted { background: var(--surface-alt); color: var(--muted); }
  .pill-gold { background: rgba(201,162,39,0.18); color: var(--gold); }
  .pill-hold { background: rgba(214,73,31,0.18); color: var(--hold); }
  .back-btn {
    display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0; margin-bottom: 16px; font-size: 11px;
  }
  .baseline { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .detail-head { display: flex; align-items: center; gap: 10px; }
  .info-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .note-details + .note-details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .note-summary { font-size: 10px; cursor: pointer; margin-bottom: 3px; }
  .note-details[open] .note-summary { margin-bottom: 8px; }
  .info-body { color: var(--chalk); font-size: 14px; line-height: 1.5; margin-top: 6px; }
  .chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 10px 6px; margin-bottom: 14px; overflow-x: auto; }
  .chart-label { font-size: 10px; color: var(--muted); padding: 0 6px 8px; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 10px; color: var(--muted); margin-bottom: 6px; display: block; }
  .field input, .field select, .field textarea {
    background: var(--surface-alt); border: 1px solid var(--line); color: var(--chalk);
    border-radius: 6px; padding: 10px 12px; font-size: 16px; width: 100%; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 12px; margin-bottom: 14px; }
  .form-actions { display: flex; gap: 10px; margin-top: 14px; }
  .form-actions .btn-primary, .form-actions .btn-ghost { padding: 12px 16px; font-size: 12px; }
  .form-actions .btn-primary { flex: 1; }
  .checks { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .check-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--chalk); }
  .error-text { color: var(--danger); font-size: 12px; margin-top: -6px; margin-bottom: 10px; }
  .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hist-main { color: var(--chalk); font-size: 14px; }
  .hist-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; display: flex; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0 4px; }
  .hist-title { font-size: 10px; color: var(--muted); margin-bottom: 10px; }
  .section-title { margin-top: 22px; }
  .ql-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .ql-name { font-size: 14px; color: var(--chalk); margin-bottom: 10px; }
  .ql-fields .field { margin-bottom: 0; }
  .data-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .flash-msg { background: var(--surface-alt); border: 1px solid var(--line); color: var(--chalk); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------- data ----------------
var CATEGORY_ORDER_BASE = ["Pull", "Push", "Shoulders", "Arms", "Grip", "Core", "Posterior Chain", "Legs"];
var UNIT_FIELDS = { reps_weight: ["sets","reps","weight"], reps: ["sets","reps"], time: ["sets","time"] };

var BUILT_IN_EXERCISES = [
  { id: "lateral-raise", name: "Lateral Raises", category: "Shoulders", unit: "reps_weight",
    baseline: "3x10-12 @ 10kg, no struggle", goal: "Add load without losing strict form",
    progression: "Add 1-2kg once 3x12 is clean. Before adding weight, try a 3-4s eccentric, or lean away from the load (leaning lateral raise) for more range under tension.",
    substitute: "Cable or machine lateral raise gives constant tension through the whole rep — good to rotate in, but nothing really replaces this as pure isolation." },
  { id: "chin-up", name: "Chin-ups", category: "Pull", unit: "reps_weight",
    baseline: "3x6-8 bodyweight", goal: "Build toward weighted sets",
    progression: "Once 3x8 feels solid, add weight in small 1.25-2.5kg jumps via belt. Slowing the negative to ~3s adds hypertrophy stimulus without needing more load.",
    substitute: "Chin-ups are lat-dominant — biceps get secondary work only. They won't fully replace a curl for pure arm size; keep a curl variant (or hammer curls, which also hit the forearm) if size is the actual goal." },
  { id: "overhead-triceps-ext", name: "Overhead Triceps Extension", category: "Push", unit: "reps_weight",
    baseline: "Currently doing this, prefer dips", goal: "Keep as long-head triceps work alongside dips",
    progression: "Progress load slowly — this is a stretched-position exercise, easy to overreach on the shoulder. Single-arm version adds a stability/core-bracing element.",
    substitute: "Dips are compound (chest/front delt/triceps) and don't stretch the triceps long head much. This move covers what dips miss — keep both rather than dropping one for the other." },
  { id: "dips", name: "Dips", category: "Push", unit: "reps_weight",
    baseline: "3x8-12 with up to +30kg", goal: "Continue strength progression",
    progression: "Try slow-tempo dips or ring dips (stability demand) before chasing more weight — you're already strong here.",
    substitute: "Complementary to overhead triceps extension, not a replacement." },
  { id: "push-up", name: "Push-ups", category: "Push", unit: "reps",
    baseline: "3x8-12, easy, prefer not to add weight", goal: "Increase difficulty via leverage/instability rather than load",
    progression: "No-weight path: ring push-ups (instability) then archer push-ups (asymmetric load, a natural bridge toward one-arm work) then pseudo-planche push-ups (hands by hips, forward lean) then deficit push-ups (feet or hands elevated) for extra range. Archer and one-arm variants double as anti-rotation core work, so they pair nicely with the Pallof press.",
    substitute: "One-arm specific path if you want a dedicated second track: wide-stance one-arm negatives, then one-arm push-up with the free hand lightly touching down for balance, then one-arm push-up off an elevated surface, then full one-arm push-up on the floor." },
  { id: "hammer-curl", name: "Hammer Curls", category: "Arms", unit: "reps_weight",
    baseline: "Not currently programmed", goal: "Direct biceps/brachialis size work alongside chin-ups",
    progression: "Straightforward load progression — add 1-2kg once 3x10-12 is clean. The neutral grip also works the brachioradialis, so it does double duty as forearm rotation work.",
    substitute: "Pairs with chin-ups rather than replacing them — chin-ups are lat-dominant so biceps only get secondary work there." },
  { id: "dead-hang", name: "Dead Hang", category: "Grip", unit: "time",
    baseline: "1:30, working toward 3:00", goal: "3:00 bodyweight hang",
    progression: "Past ~2:00 bodyweight, long hangs give diminishing grip-strength returns. Consider capping bodyweight hangs around 90s and adding light weight for shorter hangs instead. Alternate active hangs (shoulders engaged, scapula depressed) with passive dead hangs.",
    substitute: null },
  { id: "forearm-work", name: "Forearm Flexion/Extension", category: "Grip", unit: "reps_weight",
    baseline: "Not currently programmed", goal: "Build balanced forearm work",
    progression: "Wrist curls (flexion) plus reverse wrist curls (extension) cover two planes. Add a rotational drill — hammer/plate pronation-supination or a wrist roller — since rotation is the gap in flexion/extension-only work.",
    substitute: null },
  { id: "pallof-press", name: "Pallof Press", category: "Core", unit: "reps_weight",
    baseline: "Not currently programmed", goal: "Cover anti-rotation, the gap your static holds don't touch",
    progression: "Start half-kneeling for extra stability feedback, then move to standing. Once standing feels solid, add a step-out or press to overhead at the end range for more anti-rotation demand.",
    substitute: null },
  { id: "core-holds", name: "Plank / Side Plank / Superman", category: "Core", unit: "time",
    baseline: "1:00 on all, not challenging", goal: "Progress beyond static holds",
    progression: "Weighted plank, Copenhagen plank (side plank progression, also loads adductors), and superman with added hold or light resistance. Gap: none of these train anti-rotation — a Pallof press closes that.",
    substitute: null },
  { id: "hanging-leg-raise", name: "Hanging Leg Raises", category: "Core", unit: "reps",
    baseline: "3x8-12, easy", goal: "Progress toward dragon flag",
    progression: "Path: straight-leg raise then toes-to-bar then weighted leg raise then dragon flag as the long-term target.",
    substitute: null },
  { id: "rdl", name: "Romanian Deadlift", category: "Posterior Chain", unit: "reps_weight",
    baseline: "Not currently programmed", goal: "Fill the hamstring gap alongside bridges",
    progression: "Start light with a double-leg RDL to groove the hip hinge, then move to single-leg for stability. Nordic curls are a good longer-term target once hamstring strength catches up — they're considerably harder than RDLs, so treat them as a destination, not a starting point.",
    substitute: null },
  { id: "bridges", name: "Bridges (lower back)", category: "Posterior Chain", unit: "reps_weight",
    baseline: "Comfortable, just underused", goal: "Increase frequency first, then progress",
    progression: "Single-leg glute bridge next, then loaded hip thrust.",
    substitute: null },
  { id: "pistol-squat", name: "Pistol Squats", category: "Legs", unit: "reps_weight",
    baseline: "3x8/leg, can add weight", goal: "Progress difficulty and load",
    progression: "Deficit pistol squat for extra range, shrimp squat as the next step up in difficulty.",
    substitute: null },
  { id: "calf-raise", name: "Calf Raises", category: "Legs", unit: "reps_weight",
    baseline: "Weighted, not difficult", goal: "Full calf coverage",
    progression: "Alternate standing (gastrocnemius) and seated/bent-knee (soleus) raises, and move to single-leg weighted for real progression.",
    substitute: null }
];

var BUILT_IN_SESSIONS = [
  { id: "all", label: "All", blurb: "Full exercise list, grouped by category." },
  { id: "full", label: "Full Routine", blurb: "All 12 in one session, twice a week, ordered to protect quality: compounds first while fresh, then isolation, then core last so trunk stability isn't pre-fatigued before pistol squats and RDL.",
    exerciseIds: ["chin-up","dips","pistol-squat","rdl","lateral-raise","hammer-curl","overhead-triceps-ext","push-up","pallof-press","core-holds","hanging-leg-raise","calf-raise"] },
  { id: "A", label: "Session A", blurb: "Compound-lean: one lift from each of pull, push, legs, posterior chain, shoulders, plus an anti-rotation core finisher.",
    exerciseIds: ["chin-up","dips","pistol-squat","rdl","lateral-raise","pallof-press"] },
  { id: "B", label: "Session B", blurb: "Accessory-lean: bodyweight push, isolation arm work, static core, and calves. Complements A rather than repeating it.",
    exerciseIds: ["push-up","overhead-triceps-ext","hammer-curl","core-holds","hanging-leg-raise","calf-raise"] },
  { id: "C", label: "Session C · ~10min", blurb: "Short, dedicated grip and forearm work. Good as a standalone extra session, or slotted onto a rest day since it's low-fatigue.",
    exerciseIds: ["dead-hang","forearm-work"] }
];

// ---------------- storage ----------------
function safeGet(key, fallback) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}
function getCustomExercises() { return safeGet("customExercises", []); }
function saveCustomExercises(arr) { return safeSet("customExercises", arr); }
function getOverrides() { return safeGet("exerciseOverrides", {}); }
function saveOverrides(obj) { return safeSet("exerciseOverrides", obj); }
function getLogs(id) { return safeGet("logs:" + id, []); }
function saveLogs(id, logs) { return safeSet("logs:" + id, logs); }
function deleteLogsFor(id) { try { localStorage.removeItem("logs:" + id); } catch (e) {} }

// ---------------- derived ----------------
function allExercises() {
  var overrides = getOverrides();
  var builtins = BUILT_IN_EXERCISES.map(function (e) {
    var o = overrides[e.id];
    return o ? Object.assign({}, e, o) : e;
  });
  return builtins.concat(getCustomExercises());
}
function exerciseMap() {
  var m = {};
  allExercises().forEach(function (e) { m[e.id] = e; });
  return m;
}
function categoriesInOrder() {
  var cats = CATEGORY_ORDER_BASE.slice();
  allExercises().forEach(function (e) {
    if (cats.indexOf(e.category) === -1) cats.push(e.category);
  });
  return cats;
}
function sessionExercises(sessionId) {
  var def = BUILT_IN_SESSIONS.filter(function (s) { return s.id === sessionId; })[0];
  if (!def) return [];
  var map = exerciseMap();
  var base = (def.exerciseIds || []).map(function (id) { return map[id]; }).filter(Boolean);
  var extra = getCustomExercises().filter(function (e) {
    return (e.sessionIds || []).indexOf(sessionId) !== -1;
  });
  return base.concat(extra);
}

// ---------------- state ----------------
var state = { view: "home", sessionId: "all", openId: null, quickSessionId: null, showAddForm: false, showLogForm: false, showEditForm: false, flashMessage: null, exportFallback: null };

// ---------------- helpers ----------------
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTime(sec) {
  sec = sec || 0;
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" + s : s);
}
function lastSessionLabel(ex, log) {
  if (!log) return "Not logged yet";
  var parts = [];
  if (log.sets) parts.push(log.sets + "x");
  if (ex.unit === "time") parts.push(fmtTime(log.time || 0));
  else if (log.reps) parts.push(log.reps);
  if (log.weight) parts.push("+" + log.weight + "kg");
  return parts.join(" ") || "Logged";
}
function slugify(str) {
  return String(str).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function isBuiltIn(id) {
  for (var i = 0; i < BUILT_IN_EXERCISES.length; i++) if (BUILT_IN_EXERCISES[i].id === id) return true;
  return false;
}
function uniqueId(base) {
  var ids = allExercises().map(function (e) { return e.id; });
  base = base || "exercise";
  var id = base, n = 2;
  while (ids.indexOf(id) !== -1) { id = base + "-" + n; n++; }
  return id;
}

// ---------------- icons ----------------
var ICO_BACK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';
var ICO_PLUS = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
var ICO_TRASH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>';
var ICO_EDIT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
var ICO_DOWNLOAD = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
var ICO_UPLOAD = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>';

// ---------------- flash message ----------------
function flash(msg) {
  state.flashMessage = msg;
  render();
  setTimeout(function () {
    if (state.flashMessage === msg) { state.flashMessage = null; render(); }
  }, 4500);
}

// ---------------- CSV export / import ----------------
function csvEscape(field) {
  field = field === null || field === undefined ? "" : String(field);
  if (/[",\n\r]/.test(field)) field = '"' + field.replace(/"/g, '""') + '"';
  return field;
}
function buildCSV() {
  var header = ["exercise_id", "exercise_name", "category", "unit", "date", "sets", "reps", "weight", "time_seconds", "note"];
  var rows = [header.join(",")];
  allExercises().forEach(function (ex) {
    getLogs(ex.id).forEach(function (l) {
      var row = [ex.id, ex.name, ex.category, ex.unit, l.date, l.sets || "", l.reps || "", l.weight || "", l.time || "", l.note || ""];
      rows.push(row.map(csvEscape).join(","));
    });
  });
  return rows.join("\r\n");
}
function parseCSV(text) {
  var rows = [], row = [], field = "", inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\r") { /* skip */ }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return !(r.length === 1 && r[0] === ""); });
}
async function exportCSV() {
  var csv = buildCSV();
  if (!csv || csv.split("\r\n").length < 2) { flash("No logged data yet to export."); return; }
  if (typeof window.claude === "object" && window.claude && typeof window.claude.use === "function") {
    try {
      var downloads = await window.claude.use("downloads");
      if (downloads) {
        try {
          await downloads.save({ filename: "training-log-export.csv", data: csv });
          return;
        } catch (err) {
          if (err && err.code === "declined") return;
        }
      }
    } catch (e) { /* fall through */ }
  }
  state.exportFallback = csv;
  render();
}
function dismissExportFallback() { state.exportFallback = null; render(); }
function exportFallbackHTML(csv) {
  return (
    '<div class="form-box">' +
      '<div class="field"><label>Downloads aren\u2019t available in this view \u2014 select all and copy the text below into a .csv file</label>' +
      '<textarea readonly style="min-height:160px;font-family:ui-monospace,monospace;font-size:12px;" onclick="this.select()">' + esc(csv) + '</textarea></div>' +
      '<div class="form-actions"><button class="btn btn-ghost disp" onclick="dismissExportFallback()">Close</button></div>' +
    '</div>'
  );
}
function triggerImport() {
  var el = document.getElementById("import-file");
  if (el) el.click();
}
function handleImportFile(event) {
  var file = event.target.files && event.target.files[0];
  event.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    try { importCSVText(e.target.result); }
    catch (err) { flash("Couldn't read that file \u2014 expecting a CSV exported from this app."); }
  };
  reader.readAsText(file);
}
function importCSVText(text) {
  var rows = parseCSV(text.trim());
  if (!rows.length) { flash("That file had no rows to import."); return; }
  var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
  var idx = {};
  header.forEach(function (h, i) { idx[h] = i; });

  var map = exerciseMap();
  var custom = getCustomExercises();
  var logsCache = {};
  var added = 0, createdExercises = 0, customChanged = false;

  for (var r = 1; r < rows.length; r++) {
    var cols = rows[r];
    if (!cols || !cols.length) continue;
    var get = function (name) { return idx[name] !== undefined ? (cols[idx[name]] || "").trim() : ""; };
    var exId = get("exercise_id") || slugify(get("exercise_name") || "");
    if (!exId) continue;
    var dateRaw = get("date");
    if (!dateRaw) continue;
    var parsedDate = new Date(dateRaw);
    var isoDate = isNaN(parsedDate.getTime()) ? dateRaw : parsedDate.toISOString();

    if (!map[exId]) {
      var unitRaw = get("unit");
      var unit = (unitRaw === "reps" || unitRaw === "time" || unitRaw === "reps_weight") ? unitRaw : "reps_weight";
      var newEx = {
        id: exId,
        name: get("exercise_name") || exId,
        category: get("category") || "Imported",
        unit: unit,
        baseline: null, goal: null, progression: null, substitute: null,
        sessionIds: [], isCustom: true
      };
      custom.push(newEx);
      map[exId] = newEx;
      createdExercises++;
      customChanged = true;
    }

    var entry = { date: isoDate };
    var setsV = get("sets"); if (setsV) entry.sets = Number(setsV);
    var repsV = get("reps"); if (repsV) entry.reps = Number(repsV);
    var weightV = get("weight"); if (weightV) entry.weight = Number(weightV);
    var timeV = get("time_seconds") || get("time"); if (timeV) entry.time = Number(timeV);
    var noteV = get("note"); if (noteV) entry.note = noteV;

    if (!logsCache[exId]) logsCache[exId] = getLogs(exId).slice();
    var isDup = logsCache[exId].some(function (l) {
      return l.date === entry.date && (l.sets || null) === (entry.sets || null) &&
        (l.reps || null) === (entry.reps || null) && (l.weight || null) === (entry.weight || null) &&
        (l.time || null) === (entry.time || null) && (l.note || "") === (entry.note || "");
    });
    if (!isDup) { logsCache[exId].push(entry); added++; }
  }

  if (customChanged) saveCustomExercises(custom);
  Object.keys(logsCache).forEach(function (exId) {
    var arr = logsCache[exId];
    arr.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
    saveLogs(exId, arr);
  });

  var msg = "Imported " + added + " log " + (added === 1 ? "entry" : "entries");
  if (createdExercises) msg += " and created " + createdExercises + " new exercise" + (createdExercises === 1 ? "" : "s");
  msg += ".";
  flash(msg);
}

function chartSVG(ex, logs) {
  if (logs.length < 2) return "";
  var vals = logs.map(function (l) {
    return ex.unit === "time" ? (l.time || 0) : ex.unit === "reps_weight" ? (l.weight || 0) : (l.reps || 0);
  });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min = min - 1; max = max + 1; }
  var w = 300, h = 90, pad = 10;
  var stepX = (w - pad * 2) / (vals.length - 1);
  var pts = vals.map(function (v, i) {
    var x = pad + i * stepX;
    var y = pad + (1 - (v - min) / (max - min)) * (h - pad * 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  var circles = vals.map(function (v, i) {
    var parts = pts[i].split(",");
    return '<circle cx="' + parts[0] + '" cy="' + parts[1] + '" r="3" fill="var(--hold)" />';
  }).join("");
  var label = ex.unit === "time" ? "Seconds held" : ex.unit === "reps_weight" ? "Added weight (kg)" : "Reps";
  return (
    '<div class="chart-box"><div class="chart-label">' + label + ' over time</div>' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="110" preserveAspectRatio="xMidYMid meet">' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--hold)" stroke-width="2" />' +
      circles +
    '</svg></div>'
  );
}

      var m = Number(document.getElementById("ql-min-" + ex.id).value || 0);
      var sec = Number(document.getElementById("ql-sec-" + ex.id).value || 0);
      if (m || sec) { entry.time = m * 60 + sec; hasAny = true; }
    }
    if (hasAny) {
      var logs = getLogs(ex.id);
      logs.push(entry);
      logs.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
      saveLogs(ex.id, logs);
    }
  });
  state.view = "home";
  state.sessionId = sessionId;
  render();
}

// ---------------- navigation ----------------
function openExercise(id) { state.view = "detail"; state.openId = id; state.showLogForm = false; state.showEditForm = false; render(); }
function goHome() { state.view = "home"; state.openId = null; render(); }
function selectSession(id) { state.sessionId = id; render(); }

// ---------------- render root ----------------
function render() {
  var app = document.getElementById("app");
  if (state.view === "detail" && state.openId) {
    var ex = exerciseMap()[state.openId];
    if (ex) { app.innerHTML = detailHTML(ex); return; }
    state.view = "home";
  }
  if (state.view === "quicklog" && state.quickSessionId) {
    app.innerHTML = quickLogHTML(state.quickSessionId);
    return;
  }
  app.innerHTML = homeHTML();
}

render();
</script>
</body>
</html>
